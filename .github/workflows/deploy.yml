name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install App Dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to Render via API
        run: |
          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0

          while [ $COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((COUNT+1)) to trigger Render API deployment..."

            RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/${{ secrets.SERVICEID }}/deploys"               -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"               -H "Content-Type: application/json"               -d '{}')

            echo "Render Response: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null || echo "")

            if [ -n "$STATUS" ]; then
              echo "✅ Deployment triggered successfully! ID: $STATUS"
              SUCCESS=1
              break
            fi

            COUNT=$((COUNT+1))
            echo "Retrying in 10 seconds..."
            sleep 10
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Render deploy failed after $MAX_RETRIES attempts."
            exit 1
          fi
